name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # daemon/dictated.py imports numpy at module level (the daemon needs it at runtime via
      # mlx-whisper); without it every test that loads the daemon fails at import time.
      # main has been red since fa50a2a for exactly this reason.
      - run: python3 -m pip install numpy
      - run: python3 -m compileall daemon scripts vendor
      - run: bash -n install.sh uninstall.sh scripts/doctor.sh scripts/smoke-test.sh
      - run: python3 scripts/public-safety-scan.py
      - run: python3 scripts/check-contracts.py
      - run: python3 -m unittest discover tests
      - run: python3 scripts/golden-bench.py --skip-daemon
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
