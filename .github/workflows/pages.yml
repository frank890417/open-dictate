name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # the site build reads these: llms-full.txt bundles the docs, the page reports the daemon version
      - 'README.md'
      - 'IO-CONTRACT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'daemon/dictated.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Regenerate en / zh pages, llms.txt, llms-full.txt, robots.txt and sitemap.xml from
      # site/src, so docs edited elsewhere still reach llms-full.txt; then test both pages.
      - name: Build and test the site
        run: |
          node site/build.mjs
          node --test site/test/site.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
